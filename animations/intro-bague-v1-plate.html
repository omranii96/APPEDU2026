<title>Intro bague Charmed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Jost:wght@400;500&display=swap">
<style>
/* Une scène plein écran, le logo au centre ; commandes discrètes en bas. Fond encre + logo or (charte), variante crème + encre (en-tête du site). */
:root{
  --bg:#16110F; --logo:#E9CB8F; --ui:#F5EFE6; --ui-dim:rgba(245,239,230,.55); --line:rgba(245,239,230,.18);
  --gem-hi:#FBF8F2; --gem-mid:#D9D2C6; --gem-lo:#A79F93; --gem-edge:rgba(255,255,255,.55); --glint:#FFFFFF; --sheen:255,247,228;
  --serif:"Bodoni Moda",Didot,"Times New Roman",serif; --sans:Jost,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-look="creme"]{
  --bg:#F5EFE6; --logo:#16110F; --ui:#16110F; --ui-dim:rgba(22,17,15,.55); --line:rgba(22,17,15,.16);
  --gem-hi:#FFFFFF; --gem-mid:#E4DDD2; --gem-lo:#B9B0A3; --gem-edge:rgba(22,17,15,.35); --glint:#FFFFFF; --sheen:255,255,255;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ui);font:400 14px/1.4 var(--sans);overflow:hidden;transition:background .5s ease,color .5s ease}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3vh,34px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px;box-sizing:border-box;perspective:1400px}
.mark{width:min(84vw,880px);will-change:transform,opacity;transform-style:preserve-3d}
.mark svg{display:block;width:100%;height:auto;overflow:visible;color:var(--logo)}
.tag{font:italic 400 clamp(15px,1.7vw,21px)/1.3 var(--serif);letter-spacing:.01em;color:var(--ui);margin:0;opacity:0}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ui);font:500 10.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;
  padding:10px 14px;cursor:pointer;transition:border-color .2s,color .2s}
.bar button:hover{border-color:var(--ui-dim)}
.bar button:focus-visible,.bar input:focus-visible{outline:1px solid var(--ui);outline-offset:3px}
.bar button[aria-pressed="true"]{border-color:var(--ui)}
.scrub{display:flex;align-items:center;gap:10px;font:500 10.5px var(--sans);letter-spacing:.14em;color:var(--ui-dim);text-transform:uppercase}
.scrub input{width:min(220px,40vw);accent-color:var(--logo)}
.scrub output{font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right}
</style>

<div class="bar" role="group" aria-label="Commandes de l’animation">
  <button type="button" id="replay">Rejouer</button>
  <button type="button" id="slow" aria-pressed="false">Ralenti</button>
  <button type="button" id="look" aria-pressed="false">Fond crème</button>
  <label class="scrub" for="scrubber">Image par image <input type="range" id="scrubber" min="0" max="5200" step="10" value="0"><output id="clock">0,00 s</output></label>
</div>

<script>
(() => {
  'use strict';
  /* Géométrie du logo (unités du SVG) : le C et le D sont deux demi-anneaux en miroir.
     Le C est centré en x = 784, le D en x = 10442,9. Réunis au centre du logo, ils forment la bague. */
  const CX = 5613.45, CY = 750, BOX_CY = 1245;
  const OFF = CX - 784;               // 4829,45 : décalage de chaque moitié vers le centre
  const C_INNER = 1000, D_INNER = 10226.9;
  const DUR = 5200;

  const $ = id => document.getElementById(id);
  const mark = $('mark'), world = $('world'), halfC = $('halfC'), halfD = $('halfD'), gem = $('gem'), gemIn = $('gemIn'),
        glint = $('glint'), flash = $('flash'), letters = $('letters'), rect = $('revealRect'), paris = $('paris'), tag = $('tag'),
        sheenC = $('sheenC'), sheenD = $('sheenD'), sheenGrad = document.getElementById('sheen'),
        scrub = $('scrubber'), clock = $('clock');

  // courbes de Bézier cubiques (mêmes que CSS) pour un mouvement précis
  function bezier(x1, y1, x2, y2) {
    const A = (a, b) => 1 - 3 * b + 3 * a, B = (a, b) => 3 * b - 6 * a, C = a => 3 * a;
    const f = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
    const df = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
    return x => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = f(t, x1, x2) - x; const d = df(t, x1, x2); if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; }
      return f(t, y1, y2);
    };
  }
  const outCubic = bezier(.22, 1, .36, 1), inOut = bezier(.65, 0, .35, 1), soft = bezier(.45, 0, .55, 1);
  const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const lerp = (a, b, k) => a + (b - a) * k;

  // taille de départ de la bague : grande au centre de l'écran, adaptée au téléphone
  let S0 = 3;
  function measure() {
    const w = mark.getBoundingClientRect().width || 600;
    const ringPx = 1568 / 11226.9 * w;
    const target = Math.min(window.innerHeight * 0.44, window.innerWidth * 0.6, 340);
    S0 = Math.max(1.6, Math.min(6, target / ringPx));
  }

  function render(t) {
    // 1. apparition : la bague se redresse (vue de dessus vers face), 0 → 1,1 s
    const a = outCubic(seg(t, 0, 1100));
    mark.style.opacity = seg(t, 0, 450).toFixed(3);
    mark.style.transform = `rotateX(${lerp(68, 0, a).toFixed(2)}deg) scale(${lerp(.9, 1, a).toFixed(4)})`;

    // 2. reflet de lumière sur l'anneau (0,6 → 1,5 s), puis éclat sur la pierre
    const sw = seg(t, 600, 1500);
    const sx = lerp(CX - 1700, CX + 900, soft(sw));
    sheenGrad.setAttribute('gradientTransform', `translate(${sx.toFixed(1)} ${(CY + 300).toFixed(1)})`);
    const so = sw > 0 && sw < 1 ? Math.sin(Math.PI * sw) * 0.9 : 0;
    sheenC.setAttribute('opacity', so.toFixed(3)); sheenD.setAttribute('opacity', so.toFixed(3));
    const g1 = seg(t, 1250, 1700), gl = g1 > 0 && g1 < 1 ? Math.sin(Math.PI * g1) : 0;
    glint.setAttribute('opacity', gl.toFixed(3));
    glint.setAttribute('transform', `translate(105 -238) rotate(${(g1 * 90).toFixed(1)}) scale(${(0.2 + 0.8 * gl).toFixed(3)})`);

    // 3. la bague s'ouvre en deux (2,0 → 3,4 s) et chaque moitié rejoint sa place : C à gauche, D à droite
    const p = inOut(seg(t, 2000, 3500));
    // la largeur visible passe en douceur de la bague au logo complet : rien ne sort jamais de l'écran
    const S = lerp(S0 * 1568, 11226.9, p) / (1568 + 2 * OFF * p);
    const lift = (BOX_CY - CY) * (S0 > 1 ? (S - 1) / (S0 - 1) : 0);
    world.setAttribute('transform', `translate(${CX} ${CY + lift}) scale(${S.toFixed(5)}) translate(${-CX} ${-CY})`);
    const tC = OFF * (1 - p), tD = -OFF * (1 - p);
    const hinge = 7 * Math.sin(Math.PI * p);     // petite bascule, comme un fermoir qui s'ouvre
    halfC.setAttribute('transform', `translate(${tC.toFixed(2)} 0) rotate(${(-hinge).toFixed(3)} 784 ${CY})`);
    halfD.setAttribute('transform', `translate(${tD.toFixed(2)} 0) rotate(${hinge.toFixed(3)} 10442.9 ${CY})`);

    // la pierre s'élève et s'efface au moment où la bague s'ouvre
    // la pierre se resserre en un point de lumière puis disparaît dans un éclat
    const gIn = seg(t, 150, 900), gOut = inOut(seg(t, 1800, 2200));
    gem.setAttribute('opacity', (outCubic(gIn) * (1 - gOut * gOut)).toFixed(3));
    gem.setAttribute('transform', `translate(${CX} ${(-60 * gOut).toFixed(1)})`);
    gemIn.setAttribute('transform', `translate(0 -150) scale(${(1.35 * (1 - 0.8 * gOut)).toFixed(4)}) translate(0 150)`);
    const f1 = seg(t, 2000, 2550), fl = f1 > 0 && f1 < 1 ? Math.sin(Math.PI * f1) : 0;
    flash.setAttribute('opacity', fl.toFixed(3));
    flash.setAttribute('transform', `translate(${CX} ${(-160 - 60 * gOut).toFixed(1)}) rotate(${(45 + f1 * 120).toFixed(1)}) scale(${(0.3 + 1.6 * fl).toFixed(3)})`);

    // 4. les lettres H A R M E apparaissent exactement entre les deux moitiés
    const left = C_INNER + tC, right = D_INNER + tD;
    rect.setAttribute('x', Math.min(left, CX).toFixed(1));
    rect.setAttribute('width', Math.max(0, right - left).toFixed(1));

    // 5. PARIS, puis la signature
    const pr = outCubic(seg(t, 3350, 4250));
    paris.setAttribute('opacity', pr.toFixed(3));
    paris.setAttribute('transform', `translate(3700.3 ${(2524 + 160 * (1 - pr)).toFixed(1)})`);
    const tg = outCubic(seg(t, 4050, 4900));
    tag.style.opacity = tg.toFixed(3);
    tag.style.transform = `translateY(${(8 * (1 - tg)).toFixed(2)}px)`;

    scrub.value = Math.round(t);
    clock.value = (t / 1000).toFixed(2).replace('.', ',') + ' s';
  }

  // lecture
  let speed = 1, t0 = 0, from = 0, raf = 0, playing = false;
  function frame(now) {
    const t = from + (now - t0) * speed;
    if (t >= DUR) { render(DUR); playing = false; return; }
    render(t); raf = requestAnimationFrame(frame);
  }
  function play(start = 0) {
    cancelAnimationFrame(raf); measure(); from = start; t0 = performance.now(); playing = true; raf = requestAnimationFrame(frame);
  }
  function pause() { cancelAnimationFrame(raf); playing = false; }

  $('replay').addEventListener('click', () => play(0));
  $('slow').addEventListener('click', e => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', on);
    const cur = +scrub.value; speed = on ? 0.3 : 1;
    if (playing) play(cur);
  });
  $('look').addEventListener('click', e => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', on);
    e.currentTarget.textContent = on ? 'Fond encre' : 'Fond crème';
    document.documentElement.dataset.look = on ? 'creme' : '';
  });
  scrub.addEventListener('input', () => { pause(); measure(); render(+scrub.value); });
  window.addEventListener('resize', () => { measure(); if (!playing) render(+scrub.value); });

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  measure();
  if (reduce) { render(DUR); }
  else { render(0); setTimeout(() => play(0), 350); }
})();
</script>
